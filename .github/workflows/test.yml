name: Orchestrator Validation

on:
  push:
    branches:
      - main
      - analysis/**
      - feat/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Compile
        run: python -m compileall src tests

      - name: Test
        run: pytest -q
