name: Orchestrator Validation

on:
  push:
    branches:
      - main
      - analysis/**
      - feat/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify base install without gateway extras
        shell: bash
        run: |
          set -euo pipefail
          base_venv="$(mktemp -d)"
          python -m venv "$base_venv"
          "$base_venv/bin/python" -m pip install -e .
          PYTHONPATH=src "$base_venv/bin/python" -c "import adaptive_orchestrator.cli"
          PYTHONPATH=src "$base_venv/bin/python" -c "import infrastructure.openclaw_gateway_client"
          PYTHONPATH=src "$base_venv/bin/python" - <<'PY'
          from infrastructure.openclaw_gateway_client import GatewayConfig, OpenClawGatewayClient, OpenClawGatewayError
          try:
              OpenClawGatewayClient(GatewayConfig(url="ws://127.0.0.1:1"))
          except OpenClawGatewayError as exc:
              assert ".[gateway]" in str(exc)
          else:
              raise AssertionError("Gateway client unexpectedly initialized without extras")
          PY

      - name: Install
        run: python -m pip install -e ".[test,gateway]"

      - name: Compile
        run: python -m compileall src tests

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest -q --junitxml=pytest-report.xml 2>&1 | tee pytest-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-report.xml
