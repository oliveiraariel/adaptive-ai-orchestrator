[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ai-orchestrator"
version = "0.4.0"
description = "Specification-driven adaptive AI orchestrator core"
requires-python = ">=3.12"

[project.scripts]
adaptive-orchestrator = "adaptive_orchestrator.cli:main"

[project.optional-dependencies]
gateway = [
    "websockets>=15,<17",
]
test = [
    "pytest>=9,<10",
]
observability = [
    "opentelemetry-api>=1.35,<2",
    "opentelemetry-sdk>=1.35,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-dir]
"" = "src"
